[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mascot-reader"
version = "0.2.0"
description = "Offline Turkish Markdown reader with a desktop mascot"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ema-lightning==1.0.1",
  "PySide6>=6.9,<7",
  "markdown-it-py>=3,<5",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6,<7", "ruff>=0.9"]

[project.scripts]
mascot-reader = "mascot_reader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

